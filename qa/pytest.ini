[pytest]
# Run from the repository root:  python -m pytest -c qa/pytest.ini qa/tests
testpaths = tests
pythonpath = ..
addopts = -ra --strict-markers --strict-config -p no:cacheprovider -p no:asyncio
junit_family = xunit2
timeout = 300
markers =
    req(*ids): requirement ids from docs/qa/REQUIREMENTS_TRACEABILITY.csv
    severity(level): impact if this test fails: critical, high, medium, low
    suite(name): logical suite (authentication, security, contract, reliability, financial, policy, framework)
    needs_services: needs disposable PostgreSQL and Redis (QA_DATABASE_URL, QA_REDIS_URL) and starts the backend
    slow: waits on real time (expiry windows); nightly only
    critical_gate: must pass for a PR to be merge-eligible
    outage: stops a service process; runs against private Redis/backends only
    performance: bounded concurrent HTTP benchmark against the disposable QA backend
filterwarnings =
    ignore::DeprecationWarning:aiosmtpd.*
    ignore:Requiring AUTH while not requiring TLS:UserWarning
