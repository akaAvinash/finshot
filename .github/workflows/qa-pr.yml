# Mode A (pull request validation) and mode B (main branch validation).
# pull_request (never pull_request_target): PR code runs with a read-only token
# and no secrets. The gate job reads JUnit files only.
name: qa

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    uses: ./.github/workflows/qa-suite.yml
    with:
      label: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      # For a PR: test the PR head merged into the current base tip it targets.
      checkout_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      merge_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      qa_markers: ${{ github.event_name == 'pull_request' && 'not slow' || '' }}
      run_e2e: ${{ github.event_name == 'push' }}

  gate:
    name: qa gate
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted code only: the report tooling comes from the base branch, not the PR.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Bootstrap report tooling (only when the base branch has none yet)
        if: github.event_name == 'pull_request'
        env: { HEAD_SHA: "${{ github.event.pull_request.head.sha }}" }
        run: |
          # The PR that introduces qa/ has no trusted tooling on its base. Take only qa/ from the
          # PR head in that one case (read-only token, no secrets) and say so in the summary.
          if [ ! -f qa/ai_agent/supervisor.py ]; then
            git fetch --no-tags origin "$HEAD_SHA"
            git checkout "$HEAD_SHA" -- qa
            echo "> Bootstrap: report tooling taken from the PR head because the base has no qa/ yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: python -m pip install -r qa/requirements-report.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: results
      - name: Changed files
        if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}" }
        run: git fetch --no-tags origin "$HEAD_SHA" && git diff --name-only "$BASE...$HEAD_SHA" > changed.txt
      - name: Consolidated report and merge-eligibility gate
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob globstar
          rc=0
          files=(results/**/*.xml)
          python -m qa.ai_agent.supervisor \
            --junit "${files[@]:-/dev/null}" \
            --out report \
            --required backend qa frontend-unit secret-scan dependency-audit \
            --jobs "{\"suite\": \"$SUITE_RESULT\"}" \
            ${PR:+--pr "$PR"} --branch "$BRANCH" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --tested-sha "$HEAD_SHA" --expected-sha "$HEAD_SHA" \
            $( [ -f changed.txt ] && echo --changed-files changed.txt ) \
            --environment "GitHub-hosted ubuntu-latest, Postgres 16 + Redis 7 service containers" \
            --run-url "$RUN_URL" --no-ai --fail-on-ineligible \
            --title "Tradeo QA: ${PR:+PR #$PR}${PR:-main}" || rc=$?
          if [ -f report/qa-summary.md ]; then cat report/qa-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa-report-${{ github.event.pull_request.number || 'main' }}
          path: report/
          retention-days: 14
