openapi: 3.1.0
info:
  title: Tradeo API Proposal
  version: 0.9.0
  description: >
    Proposed contract for Phase 2 market data (read-only), Phase A
    authentication, the demo broker workspace (no real broker access),
    strategy versions with automatic backtest and risk checks, demo backtest
    jobs (simulated data only), a paper trading engine (simulated fills
    over demo data, no broker), read-only reports over the paper ledger and
    deterministic advisory agents that watch it (no language model), and an
    in-app alert inbox over that activity (no email, SMS or push). The
    frontend uses deterministic demo responses in
    development. This contract describes future endpoints and does not declare
    a deployed backend. No endpoint here places, modifies or cancels a real
    order; paper orders exist only in the server's paper ledger.
tags:
  - name: Markets
    description: NSE instrument reference data, quotes and historical candles.
  - name: Brokers
    description: >
      Demo broker connections stored per user on the server. No provider
      requests, OAuth flows or broker credentials. Promoted from
      `contracts/brokers.openapi.yaml` with the same paths and shapes, plus
      session, CSRF and error semantics.
  - name: Strategies
    description: >
      Per-user strategy drafts and immutable activated versions, stored on the
      server. No signals, orders or execution. Promoted from
      `contracts/strategies.openapi.yaml` with the same paths and shapes, plus
      session, CSRF and error semantics.
  - name: Backtests
    description: >
      Per-user demo backtest runs over the server's synthetic daily candles,
      queued and completed by a server-side worker. No market data provider,
      broker or order is involved. A completed run of a strategy's current
      draft sets that draft's `backtest` check (see `sendStrategyCommand`).
      Promoted from `contracts/backtesting.openapi.yaml` with the same paths
      and shapes, plus session, CSRF and error semantics.
  - name: Paper trading
    description: >
      One paper engine per user that replays the server's demo daily candles
      for an assigned active strategy, with a deterministic risk engine and a
      halt (kill switch). Simulated fills only: no broker, live data or real
      order. Promoted from `contracts/auto-trading.openapi.yaml` with session,
      CSRF and error semantics; see the operations for the differences.
  - name: Reports
    description: >
      Read-only reports over the caller's paper ledger: realised and
      unrealised P&L, a daily calendar, a trade journal, a strategy breakdown
      and a reconciliation of the paper account against its ledger. Every
      figure is derived from server-side paper fills over demo data; there is
      no live broker, so no broker statement or tax field is reported.
  - name: Agents
    description: >
      Deterministic advisory agents that watch the caller's paper ledger and
      the demo candles it replays, and record reason-coded events. Agents are
      rule-based: no language model, broker, credential or live data is
      involved. Their output is advisory only. They never place, modify or
      cancel a paper order, change a risk limit, send a paper command or
      authorise anything; the paper engine, its risk engine and the halt do
      not read agent output. Every agent endpoint is read-only (`GET`).
  - name: Alerts
    description: |
      A durable, per-user alert inbox. The server records an alert when
      something the caller should know about happens in their paper engine,
      demo broker connections, advisory agents or account security. Alerts
      describe demo and paper activity only: no real order, broker or market
      feed is involved.

      **What produces alerts.** Each alert has a `kind`; the table is the
      complete list. *In transaction* means the alert is written in the same
      database transaction as the change it describes, so it exists exactly
      when that change committed. *Worker* means a server-side worker records
      it within a few seconds of the condition becoming true.

      | `kind` | `source` | `severity` | Recorded | When |
      |---|---|---|---|---|
      | `PAPER_ENGINE_HALTED` | `paper` | `critical` | In transaction | The caller halted the paper engine (kill switch). |
      | `PAPER_RISK_LIMIT_REACHED` | `paper` | `critical` | In transaction | The risk engine blocked a buy signal because a session limit (loss or trade count) was reached. At most once per replayed session. |
      | `PAPER_ORDER_CANCELLED` | `paper` | `warning` | In transaction | The engine cancelled a queued buy because cash did not cover the open price. Orders cancelled by a halt are covered by `PAPER_ENGINE_HALTED` instead. |
      | `PAPER_STOP_LOSS_EXIT` | `paper` | `warning` | In transaction | The engine sold the position at its stop-loss. |
      | `PAPER_STRATEGY_INACTIVE` | `paper` | `warning` | In transaction | The engine paused because its assigned strategy is no longer active. |
      | `PAPER_REPLAY_FINISHED` | `paper` | `info` | In transaction | A paper replay replayed its last session. |
      | `BROKER_CONNECTION_EXPIRED` | `brokers` | `critical` | Worker | A demo broker connection passed its expiry without being reconnected. Once per connection and expiry time. |
      | `BROKER_DISCONNECTED` | `brokers` | `info` | In transaction | The caller disconnected a demo broker. |
      | `RECONCILIATION_MISMATCH` | `agents` | `warning` | Worker | The execution monitor recorded that the paper ledger stopped matching the paper account. Requires agents to be enabled. |
      | `NEW_SIGN_IN` | `security` | `info` | In transaction | A new session was created for the caller's account. |
      | `SIGNED_OUT_EVERYWHERE` | `security` | `warning` | In transaction | Every session of the caller's account was revoked (`logout-all`). |

      There is no live market feed, so no stale-market-data alert exists yet;
      demo candles are generated by the server.

      **Identity and deduplication.** Every alert has a stable, opaque `id`
      that never changes. Each source occurrence (one halt, one stop-loss
      fill, one replayed session, one connection expiry, one agent event, one
      session) produces at most one alert, even if the producer runs again
      after a crash or a retry. Alerts are append-only: only
      `acknowledgedAt` changes, once.

      **Ownership.** An alert belongs to one user. Every endpoint reads and
      acknowledges only the caller's alerts; another user's alert id is
      indistinguishable from one that does not exist (`404`).

      **Delivery.** Alerts are delivered in the app only. Email, SMS and push
      delivery are not implemented; `getAlertPreferences` reports them as
      unavailable. `critical` alerts are always listed and counted, whatever
      the preferences say.
  - name: Auth
    description: |
      Phone OTP sign-in with server-side sessions.

      **Same-origin only.** The browser calls `/api/v1/*` on the web
      application's own origin; Next.js proxies these requests to the API. The
      API is not called cross-origin from the browser, so it needs no CORS for
      these endpoints.

      **Cookies.** Both cookies are host-only (no `Domain` attribute), with
      `Path=/`, `Secure` and `SameSite=Lax`. The `__Host-` prefix makes
      browsers enforce this.

      | Cookie | Attributes | Purpose |
      |---|---|---|
      | `__Host-tradeo_session` | `HttpOnly; Secure; SameSite=Lax; Path=/` | Opaque random session identifier. The server stores only a digest. Session cookie (no `Max-Age`); server-side idle and absolute expiry are authoritative. |
      | `__Host-tradeo_csrf` | `HttpOnly; Secure; SameSite=Lax; Path=/` | Signed CSRF token (see binding below). Session cookie (no `Max-Age`); the token's own expiry is enforced server-side. |

      `Secure` cookies work on `http://localhost` in Chromium and Firefox but not
      in Safari. Local development in Safari needs HTTPS.

      **CSRF token binding.** Every state-changing request (`POST`, `PUT`,
      `PATCH`, `DELETE`) under `/api/v1/` must send an `X-CSRF-Token`
      header. A plain "header equals cookie" comparison is not enough. The
      token is a server-signed value (HMAC with a server-side secret; its
      format is opaque to clients) bound to a **context**:

      | Context | When | Bound to | Lifetime |
      |---|---|---|---|
      | `session` | The request carries a session cookie that the server resolves to a **valid server-side session** | That session's identifier. Invalid for any other session. | Never longer than the session's absolute expiry |
      | `pre_login` | No session cookie, or one that does not resolve to a valid session (the OTP flow and recovery) | A random pre-login context identifier generated by the server and carried inside the signed token | Short, server-configured |

      The server accepts the request only if all of these hold: the header
      equals the `__Host-tradeo_csrf` cookie (constant-time comparison); the
      signature is valid; the token has not expired; and the token's context
      matches the request. The request's context is decided by the
      **server-side session**, never by the presence of a cookie: a session
      cookie only counts when it resolves to a session that exists, is not
      revoked and has not passed its idle or absolute expiry. Otherwise the
      cookie is **stale** and the request is evaluated in the `pre_login`
      context. A `session` token stops working the moment its session is
      revoked or expires. If an `Origin` header is present it must match the
      application origin. Any failure returns `403 CSRF_FAILED`.

      Order of checks: for endpoints that require a session (`me`,
      `sessions`, `logout-all`) a missing or stale session returns
      `401 UNAUTHENTICATED` before any CSRF check.

      Binding rules:
      - `GET /api/v1/auth/csrf` returns a `session` token when the request
        has a valid session and a `pre_login` token when it does not. Clients
        keep the token in memory and call this endpoint again after a reload,
        a `401 UNAUTHENTICATED`, a `403 CSRF_FAILED` or logout.
      - **Recovery from an expired or revoked session.** When the request
        carries a stale session cookie, `GET /auth/csrf` switches the browser
        to pre-login: it returns a `pre_login` token, **clears the stale
        session cookie** (`Max-Age=0`), and replaces any CSRF cookie that was
        bound to the dead session. After this one call the browser holds no
        stale auth state and can start the OTP flow. A valid session cookie is
        never cleared by this endpoint, and a request with no session cookie
        gets no clearing field.
      - `otp/request` records the pre-login context on the challenge.
        `otp/verify` must arrive in that same context, otherwise it fails with
        `401 INVALID_OTP`. A code requested by one browser cannot be completed
        in another, which blocks login CSRF and session fixation.
      - `otp/verify` creates a new session and a **new `session` token bound
        to it**, returns that token in the response body (required), and
        replaces the CSRF cookie. The pre-login token and any earlier session
        identifier stop working. Clients must use the returned token for their
        next write.
      - `logout` and `logout-all` revoke the session; the old `session` token
        is invalid from then on. Both cookies are cleared.
      - `logout` requires a `session` token when the request has a valid
        session and a `pre_login` token when it does not (including a stale
        session cookie, which the response then clears).
      - `logout-all` requires a valid session and a `session` token.

      **`Set-Cookie` fields.** Responses that set or clear cookies send one
      **separate** `Set-Cookie` header field per cookie, never a comma-joined
      value (`Set-Cookie` is the exception to field combining in
      [RFC 9110 section 5.3](https://www.rfc-editor.org/rfc/rfc9110#section-5.3),
      because cookie values and dates contain commas).

      | Response | `Set-Cookie` fields |
      |---|---|
      | `GET /auth/csrf` | 0 to 2, in this order: clear the session cookie (only when a stale session cookie was sent), then set the CSRF cookie (only when a new token was issued) |
      | `POST /auth/otp/verify` `200` | 2: the session cookie, then the CSRF cookie |
      | `POST /auth/logout` `204`, `POST /auth/logout-all` `204` | 2: clear the session cookie, then clear the CSRF cookie (`Max-Age=0` and an `Expires` date in the past) |

      **Proxy requirement (Next.js to API).** The same-origin proxy must pass
      requests through unmodified (`Cookie`, `X-CSRF-Token`, `Origin`,
      `X-Request-ID`) and return **each `Set-Cookie` field as its own header**
      with name, `Path`, `Secure`, `HttpOnly` and `SameSite` unchanged and no
      `Domain` added. For example, with the Fetch API read them with
      `response.headers.getSetCookie()` and append each one; do not use
      `headers.get('set-cookie')`, which joins them. This is verified when the
      proxy is wired up, with a test that the browser receives both cookies
      after verify and neither after logout.

      **Errors.** Auth errors use `{code, message}` with an optional
      `requestId` and, for `429`, `retryAfterSeconds`. The same request ID is
      returned in the `X-Request-ID` response header.

      **Rate limits.** Limits apply per phone number, per client IP and per
      device. Exceeding one returns `429 RATE_LIMITED` with a `Retry-After`
      header. The numeric limits are server configuration, not part of this
      contract. The contract does fix: an OTP lives at most 5 minutes, is
      single use, and allows at most 5 verification attempts per challenge.
  - name: Step-up
    description: |
      Authenticator-app (TOTP) enrolment and step-up for sensitive actions.
      Regular sign-in is unchanged: phone OTP, then a server-side session.

      **Invite-only.** Only invited phone numbers can start a session. There is
      no sign-up endpoint and no admin role: the owner invites a number with a
      server-side command, outside this API. `requestOtp` answers every
      well-formed number the same way (`202`), invited or not, and sends a code
      only to an invited number, so it cannot be used to discover who is
      invited or to spend SMS. An uninvited number can never complete
      `verifyOtp` (`401 INVALID_OTP`). Existing accounts stay invited.

      **TOTP.** [RFC 6238](https://www.rfc-editor.org/rfc/rfc6238): HMAC-SHA-1,
      6 digits, 30-second steps, one step of clock skew either way. A code is
      accepted once: replaying the same code (same time step) is rejected. The
      secret is shown once, at enrolment, and stored encrypted on the server.
      There are no recovery codes: the owner resets a lost authenticator with
      a server-side command.

      **Step-up.** A sensitive action (named in the operation that needs it)
      requires the caller to have proved a current TOTP code recently.
      `POST /api/v1/auth/step-up` records that on the caller's session for a
      short window (at most 15 minutes, server-configured, never past the
      session's own expiry); `stepUpUntil` reports it. An operation that needs
      step-up returns `403 STEP_UP_REQUIRED` when the window is closed, before
      it changes anything. The window belongs to one session: signing out or
      revoking the session ends it. No operation requires step-up yet; the
      Settings contract names the first ones.

      **Rate limits.** Wrong codes count per user and per IP. Exceeding the
      limit returns `429 RATE_LIMITED`, as in the Auth tag.

      **Passkeys.** A WebAuthn module is planned behind a server-side
      interface. It adds no endpoint yet and nothing here depends on it.
paths:
  /api/v1/market/instruments:
    get:
      operationId: getMarketInstruments
      tags: [Markets]
      summary: List or search the instrument catalog
      parameters:
        - name: query
          in: query
          description: Case-insensitive search by symbol, instrument ID, name or alias.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Matching instruments. An empty array indicates no matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/MarketDataUnavailable'
  /api/v1/market/overview:
    get:
      operationId: getMarketOverview
      tags: [Markets]
      summary: Get a dated quote and exchange-session snapshot
      responses:
        '200':
          description: Latest market snapshot for the available instrument catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverview'
        '503':
          $ref: '#/components/responses/MarketDataUnavailable'
  /api/v1/market/instruments/{instrumentId}/candles:
    get:
      operationId: getMarketCandles
      tags: [Markets]
      summary: Get recent OHLC candles for one instrument and timeframe
      parameters:
        - name: instrumentId
          in: path
          required: true
          description: Stable exchange-qualified instrument identifier.
          schema:
            $ref: '#/components/schemas/InstrumentId'
        - name: timeframe
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Timeframe'
      responses:
        '200':
          description: >
            Candles in ascending order with distinct timestamps. A valid selection
            with no available history returns an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCandles'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/UnknownInstrument'
        '503':
          $ref: '#/components/responses/MarketDataUnavailable'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      summary: Get the CSRF token for state-changing requests
      description: >
        Returns the current CSRF token, creating one (and setting the
        `__Host-tradeo_csrf` cookie) if the client has none, or has an expired
        or wrong-context one. Returns a `session` token when the request has a
        valid server-side session and a `pre_login` token otherwise.

        This is also the recovery path after a session expires or is revoked.
        If the request carries a session cookie that no longer resolves to a
        valid session, the response is `pre_login`, clears the stale session
        cookie with a separate `Set-Cookie` field, and replaces any CSRF
        cookie bound to the dead session. A valid session cookie is left
        alone. Safe to call on every page load.
      security: []
      responses:
        '200':
          description: >
            CSRF token. Send it as the `X-CSRF-Token` header. `context` is
            `pre_login` when there is no valid session, including after the
            stale session cookie was cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCsrf'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [Auth]
      summary: Send a one-time code to a phone number
      description: >
        Creates a challenge and asks the delivery provider to send a random
        six-digit code by `channel` (SMS by default, or email to the address
        on file). The response is identical for every well-formed phone
        number, whether or not the number is invited or has an account, and
        whether or not the account has an email on file, so it cannot be used
        to discover accounts or invites. A code is sent only to an invited
        number (see the Step-up tag); for any other number the challenge can
        never be completed and nothing is sent or spent. Codes are never
        returned by this API and never written to application or shared logs.
        Outside production, a mock provider (development and automated tests)
        or a staging provider (server-side file, read by the operator over
        SSH) can stand in for real delivery; production never falls back to
        either. A code lives at most 5 minutes, and a number can ask for a new
        one after `resendAvailableAt` (60 seconds).
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: A challenge was created and delivery was requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '503':
          $ref: '#/components/responses/AuthOtpDeliveryUnavailable'
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify a one-time code and start a session
      description: >
        On success the account is created if needed, the challenge is consumed
        atomically (a code works once), and a new session is created. The
        response sets two separate `Set-Cookie` fields (session, then CSRF) and
        returns the new session-bound `csrfToken`, which the client must use
        for its next write. A wrong, expired, already used or unknown code, or
        a challenge requested in a different pre-login context, all return the
        same `401 INVALID_OTP`, so the response does not reveal which. After 5
        failed attempts the challenge is dead and the client must request a
        new code.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Signed in. Two `Set-Cookie` fields are sent.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          description: The code is not valid for this challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
              example:
                code: INVALID_OTP
                message: The code is invalid or has expired.
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /api/v1/auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [Step-up]
      summary: Start authenticator-app enrolment
      description: |
        Creates a pending TOTP secret for the caller and returns it once, as
        text and as an `otpauth://` URI for a QR code. The secret is not active
        until `confirmTotp` succeeds. Calling again while a secret is pending
        replaces it. The request has no body.

        The session must have signed in within the last 15 minutes (the
        session's `createdAt`); otherwise the call returns `403
        STEP_UP_REQUIRED` and the caller signs in again first. This stops a
        stolen idle session from enrolling an attacker's authenticator.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: A pending secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthStepUpOrCsrf'
        '409':
          $ref: '#/components/responses/AuthTotpAlreadyEnrolled'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /api/v1/auth/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [Step-up]
      summary: Activate authenticator-app enrolment
      description: |
        Activates the pending secret when `code` is a valid current code from
        the authenticator. On success the caller's session is also stepped up
        (`stepUpUntil` is set), because the caller just proved the factor.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: TOTP is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResult'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
        '409':
          $ref: '#/components/responses/AuthTotpNotPending'
        '422':
          $ref: '#/components/responses/AuthInvalidTotp'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /api/v1/auth/step-up:
    post:
      operationId: stepUp
      tags: [Step-up]
      summary: Prove a current authenticator code on this session
      description: |
        Verifies `code` against the caller's active TOTP secret and opens the
        step-up window on the caller's session. Only the calling session is
        affected. Wrong codes do not open the window.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: The step-up window is open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResult'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
        '409':
          $ref: '#/components/responses/AuthTotpNotEnrolled'
        '422':
          $ref: '#/components/responses/AuthInvalidTotp'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /api/v1/auth/totp/disable:
    post:
      operationId: disableTotp
      tags: [Step-up]
      summary: Remove the authenticator
      description: |
        Removes the caller's TOTP secret when `code` is a valid current code,
        and closes the step-up window on every session of the caller. The
        action is recorded in the audit log. After it, step-up is unavailable
        until the caller enrols again.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '204':
          description: TOTP was removed.
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
        '409':
          $ref: '#/components/responses/AuthTotpNotEnrolled'
        '422':
          $ref: '#/components/responses/AuthInvalidTotp'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the signed-in user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The user and session expiry. Activity extends the idle expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the current session
      description: >
        Revokes the current session server-side and clears both cookies with
        two separate `Set-Cookie` fields. Idempotent: succeeds with 204 even if
        the session already ended. Requires a `session` CSRF token when the
        request has a valid session, otherwise a `pre_login` token.
      security:
        - csrfHeader: []
      responses:
        '204':
          description: Signed out. Two `Set-Cookie` fields clear both cookies.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogout'
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Auth]
      summary: End every session for the signed-in user
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: All sessions revoked. Two `Set-Cookie` fields clear both cookies.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogout'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthCsrfFailed'
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [Auth]
      summary: List the signed-in user's active sessions
      description: Only the caller's own, unexpired, unrevoked sessions are returned.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
  /api/v1/brokers/preview:
    get:
      operationId: getBrokers
      tags: [Brokers]
      summary: Read the signed-in user's demo broker connections
      description: >
        Returns one entry per supported provider, in the order `zerodha`,
        `fyers`. A provider the user has never connected, or has disconnected,
        has `account: null`. A new user starts with every provider
        disconnected and no events. The demo source always returns
        `status: ready`; `stale` and `empty` are reserved for future
        providers and are not emitted by the demo source.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's broker snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerResult'
        '401':
          $ref: '#/components/responses/BrokerUnauthenticated'
        '503':
          $ref: '#/components/responses/BrokerUnavailable'
  /api/v1/brokers/preview/{provider}/actions:
    post:
      operationId: sendBrokerAction
      tags: [Brokers]
      summary: Apply a simulated broker account action
      description: >
        Applies one action to the caller's demo connection for `provider` and
        returns the updated snapshot. `connect` requires a disconnected
        account, `reconnect` requires an expired account, and `sync` and
        `disconnect` require an account that is connected or expired
        (`sync` only when connected). `connect` and `reconnect` create a
        demo account that expires 8 hours later with `lastSyncedAt: null`.
        `sync` sets `lastSyncedAt` to the server time. `disconnect` removes
        the account and keeps the event log. Every successful action appends
        one event. The actions perform no provider requests and no broker
        credentials are involved. Requires a valid session and a `session`
        CSRF token (see the Auth tag); a missing or stale session returns
        `401` before the CSRF check.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BrokerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerActionRequest'
      responses:
        '200':
          description: Updated broker snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerSnapshot'
        '400':
          $ref: '#/components/responses/BrokerInvalidRequest'
        '401':
          $ref: '#/components/responses/BrokerUnauthenticated'
        '403':
          $ref: '#/components/responses/BrokerCsrfFailed'
        '409':
          $ref: '#/components/responses/BrokerActionConflict'
        '503':
          $ref: '#/components/responses/BrokerUnavailable'
  /api/v1/strategies/preview:
    get:
      operationId: getStrategies
      tags: [Strategies]
      summary: Read the signed-in user's strategies
      description: >
        Returns the caller's strategies, oldest first. A new user has none and
        gets `status: ready` with an empty `strategies` list. The demo source
        always returns `status: ready`; `stale` and `empty` are reserved and
        not emitted. `metrics` is always null until paper execution exists:
        the server never reports profit or win rate it has not measured.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's strategy snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyResult'
        '401':
          $ref: '#/components/responses/StrategyUnauthenticated'
        '503':
          $ref: '#/components/responses/StrategyUnavailable'
  /api/v1/strategies/preview/commands:
    post:
      operationId: sendStrategyCommand
      tags: [Strategies]
      summary: Apply a strategy command
      description: |
        Applies one command to the caller's strategies and returns the updated
        snapshot. No orders are placed and nothing runs against a broker.

        - `create` adds a strategy with status `draft` and a draft whose
          `backtest` is `unavailable` and whose `riskReview` is set by the risk
          rule below. A user can hold at most 100 strategies; beyond that
          `create` returns `409`.
        - `save-draft` replaces the strategy's draft (allowed in any status),
          resets its `backtest` to `unavailable` and sets `riskReview` by the
          risk rule. An active or paused strategy keeps running its latest
          version meanwhile.
        - `activate` requires the strategy not to be `active`. The candidate is
          the draft if there is one, otherwise the latest version. The
          candidate needs `backtest: passed` and `riskReview: approved`,
          otherwise `409`. With a draft, activation appends a new immutable
          version (numbered from 1, never reused or edited) and clears the
          draft. Without a draft (a paused strategy) it only sets the status
          back to `active`; history is unchanged.
        - `pause` requires status `active`.

        Both checks are automatic server rules; there is no manual approval.

        **Risk rule.** `riskReview` is `approved` when `positionSizeBps` and
        `stopLossBps` are within the draft's `riskTier` limits, otherwise
        `rejected`. `pending` is no longer emitted.

        | riskTier | max positionSizeBps | max stopLossBps | min maxDrawdownBps |
        |----------|---------------------|-----------------|--------------------|
        | low      | 600                 | 100             | -500               |
        | medium   | 1000                | 200             | -1000              |
        | high     | 1500                | 300             | -2000              |

        **Backtest rule.** When a backtest run of revision `draft` completes,
        it counts if the strategy's draft still has the same parameters the
        run copied, the run's `instrumentId` is the draft's instrument, and
        the run's `feeBps` and `slippageBps` are at least the paper engine's
        (3 and 5). A run that counts sets the draft's `backtest` to `passed`
        if all of these hold, otherwise `failed`: at least 10 out-of-sample sessions (equity points), at least
        one trade, `netPnlPaise` at least 0, and `maxDrawdownBps` at least the
        tier's minimum above. The latest run that counts wins. Runs of a
        version, failed runs and runs that do not count leave it unchanged. Thresholds are fixed server configuration
        examples, not investment advice; demo candles are synthetic. Existing
        drafts are re-evaluated by these rules when this is deployed.

        Parameters are trimmed (`name`, `description`) before
        validation. Requires a valid session and a `session` CSRF token; a
        missing or stale session returns `401` before the CSRF check. An
        unknown `id`, or one that belongs to another user, returns `404`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCommand'
      responses:
        '200':
          description: Updated strategy snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategySnapshot'
        '400':
          $ref: '#/components/responses/StrategyInvalidRequest'
        '401':
          $ref: '#/components/responses/StrategyUnauthenticated'
        '403':
          $ref: '#/components/responses/StrategyCsrfFailed'
        '404':
          $ref: '#/components/responses/StrategyNotFound'
        '409':
          $ref: '#/components/responses/StrategyConflict'
        '503':
          $ref: '#/components/responses/StrategyUnavailable'
  /api/v1/backtests/preview:
    get:
      operationId: getBacktestWorkspace
      tags: [Backtests]
      summary: Read the demo backtest workspace
      description: |
        Returns the inputs a run can use and the caller's recent runs.

        - `from` and `to` bound the demo daily history (inclusive).
        - `strategies` has one entry per backtestable revision of the caller's
          strategies: each activated version (`revision` = its number) and the
          current draft (`revision: draft`), oldest strategy first. A revision
          whose instrument has no demo history is omitted. Each `id` is opaque.
        - `instruments` lists the instruments with demo daily history.
        - `runs` holds the caller's 20 most recent runs, newest first. A new
          user has none.

        The demo source always returns `status: ready`; `stale` is reserved
        and not emitted.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's backtest workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestWorkspaceResult'
        '401':
          $ref: '#/components/responses/BacktestUnauthenticated'
        '503':
          $ref: '#/components/responses/BacktestUnavailable'
  /api/v1/backtests/preview/runs:
    post:
      operationId: startBacktest
      tags: [Backtests]
      summary: Queue a demo backtest
      description: |
        Queues one run for the caller and returns it with status `queued`. A
        server-side worker moves it to `running`, then `completed` or
        `failed`; poll `GET /api/v1/backtests/preview/runs/{runId}`.

        Validation (`400` when any rule fails):
        - `strategyId` and `instrumentId` must appear in the caller's workspace.
        - Dates are calendar dates with `from` < `outOfSampleFrom` < `to`,
          all within the workspace `from`..`to`.
        - The window needs at least three warm-up sessions before
          `outOfSampleFrom` and at least two sessions from it onwards.

        The revision supplies only `positionSizeBps`. The request's
        `instrumentId` chooses the candles, so it may differ from the
        revision's instrument.

        Replay rules, applied to each session from `outOfSampleFrom` to `to`
        in order (amounts in whole paise):
        - Signal: take the closes of the three sessions before the current
          one. The signal is long when the last of them is above their
          average (the average includes that close). The first out-of-sample
          session uses the three warm-up sessions before it, so no extra
          close is needed.
        - Prices: the session's open is rounded to whole paise. Buys fill at
          that open plus `slippageBps`, rounded up; sells fill at that open
          minus `slippageBps`, rounded down. Notional and fees use these
          rounded fill prices.
        - Fees: `feeBps` of notional on each side, rounded up to whole paise.
        - Exit: if a position is open and the signal is not long, or this is
          the last session, sell the whole position at this session's open.
        - Entry: if no position is open, the signal is long and this is not
          the last session, buy at this session's open. The budget is
          `positionSizeBps` of cash, rounded down. Quantity is the largest
          whole number whose notional plus entry fee fits the budget, so the
          entry debit never exceeds cash. A quantity of zero means no trade.
        - At most one fill per session: a session with an exit has no entry,
          and no entry happens at the last session's open, so every run ends
          flat.
        - Equity at each session is cash plus the open quantity at that
          session's close (rounded to whole paise).

        The revision's parameters are copied when the run is queued, so later
        draft edits do not change it.

        A completed run of revision `draft` sets the draft's `backtest` check
        when it counts under the backtest rule in `sendStrategyCommand` (same
        parameters as the current draft, the draft's instrument, and costs at
        least the paper engine's). Runs of a version never change a check.
        At most three runs per user may be `queued` or `running`; another
        start returns `409`. Requires a valid session and a `session` CSRF
        token; a missing or stale session returns `401` before the CSRF check.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestConfig'
      responses:
        '202':
          description: The queued run. Its status is always `queued`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BacktestRun'
                  - type: object
                    required: [status]
                    properties:
                      status:
                        const: queued
        '400':
          $ref: '#/components/responses/BacktestInvalidRequest'
        '401':
          $ref: '#/components/responses/BacktestUnauthenticated'
        '403':
          $ref: '#/components/responses/BacktestCsrfFailed'
        '409':
          $ref: '#/components/responses/BacktestConflict'
        '503':
          $ref: '#/components/responses/BacktestUnavailable'
  /api/v1/backtests/preview/runs/{runId}:
    get:
      operationId: getBacktestRun
      tags: [Backtests]
      summary: Read one of the caller's runs
      description: >
        Returns the run's current status and, once completed, its result: one
        equity point per out-of-sample session (oldest first) and the closed
        trades in order. An unknown id, a malformed id, or a run that belongs
        to another user returns `404`.
      security:
        - sessionCookie: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRun'
        '401':
          $ref: '#/components/responses/BacktestUnauthenticated'
        '404':
          $ref: '#/components/responses/BacktestNotFound'
        '503':
          $ref: '#/components/responses/BacktestUnavailable'
  /api/v1/auto-trading/paper:
    get:
      operationId: getPaperTrading
      tags: [Paper trading]
      summary: Read the paper trading workspace
      description: |
        Returns the caller's paper trading workspace. Paper trading replays
        the deterministic demo daily candles; no broker, live market data or
        real order is involved.

        - `status: empty` (with no `data`) when the caller has no active
          strategy and has never assigned one. Otherwise `ready`.
        - `strategies` lists the caller's active strategies, oldest first,
          each with its latest version.
        - `orders` holds the 20 most recent paper orders, newest first.
          `trades` holds the 50 most recent paper fills, newest first.
          `events` holds the 50 most recent events in chronological order.

        `stale` is reserved and not emitted.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's paper workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperResult'
        '401':
          $ref: '#/components/responses/PaperUnauthenticated'
        '503':
          $ref: '#/components/responses/PaperUnavailable'
  /api/v1/auto-trading/paper/commands:
    post:
      operationId: sendPaperCommand
      tags: [Paper trading]
      summary: Apply a paper engine command
      description: |
        Applies one command to the caller's paper engine and returns the
        updated workspace. No command places a real order.

        Commands (`409 PAPER_CONFLICT` when the state does not allow it):
        - `assign` needs the engine `idle` and `strategyId` to be one of the
          caller's active strategies. It pins that strategy's latest version
          and starts a fresh replay: cash back to the paper capital, no
          position, no orders, first session. Assigning the strategy that is
          already assigned is a no-op unless its replay has finished.
        - `start` needs the engine `idle`, an assigned strategy that is still
          active and an unfinished replay. It does not depend on the session
          risk counters: the next tick replays a new session, which starts
          them from zero.
        - `pause` needs the engine `running`; it becomes `idle`. Queued orders
          are kept.
        - `halt` (kill switch) needs `confirmation: STOP` and the engine not
          `halted`. It cancels every queued order and sets `halted`. Any open
          position is kept. It does not depend on any agent.
        - `reset` needs the engine `halted`; it becomes `idle`.

        While `running`, a server-side worker advances the replay by one demo
        session per tick (every few seconds). For each session, in order:
        1. A queued order fills at the session's open, rounded to whole
           paise, with `slippageBps` against the order (buys round up, sells
           round down). Fees are `feeBps` of notional, rounded up.
        2. If a position is open and the session's low reaches the stop price
           (entry price less the version's `stopLossBps`, rounded down), the
           position is sold at the lower of the open and the stop price, less
           slippage.
        3. At the close the signal is evaluated as in backtests: long when this
           session's close is above the average of the last three closes
           (this one included). No signal is evaluated until the replay has
           three closes, so the first two replayed sessions never queue an
           order. Long with no position and no queued order
           queues a buy for the next open, if the risk engine allows it. Not
           long with an open position queues a sell for the next open.
        4. On the last session of the history any open position is sold at the
           close less slippage, queued orders are cancelled, the replay is
           finished and the engine becomes `idle`.

        Risk engine (deterministic, server-side): a buy is queued only while
        the session's realised loss is below `lossLimitPaise` and its fills are
        below `tradeLimit`. The session's realised loss is the negated sum of
        its fills' `pnlPaise`, floored at zero. Quantity is sized at the
        decision close plus slippage: the smaller of the largest quantity
        whose notional plus entry fee fits `positionSizeBps` of cash (rounded
        down) and the largest quantity whose loss from that price to its stop
        price stays within `perTradeRiskPaise`. If the open gaps up so the fill
        plus fees would exceed cash, the quantity is reduced to fit; if that
        leaves zero the order is cancelled. A blocked or zero-quantity buy is
        recorded as an event instead of an order. Paper limits are fixed configuration
        examples, not recommendations: capital ₹10,00,000, daily loss ₹25,000,
        10 fills per session, per-trade risk 1% of capital, 3 bps fees and
        5 bps slippage. The capital is large enough for a low-tier size limit
        (6%) to buy at least one unit of every demo instrument.

        Every applied command and every fill writes an event. Requires a valid
        session and a `session` CSRF token; a missing or stale session returns
        `401` before the CSRF check.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperCommand'
      responses:
        '200':
          description: The updated paper workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperSnapshot'
        '400':
          $ref: '#/components/responses/PaperInvalidRequest'
        '401':
          $ref: '#/components/responses/PaperUnauthenticated'
        '403':
          $ref: '#/components/responses/PaperCsrfFailed'
        '409':
          $ref: '#/components/responses/PaperConflict'
        '503':
          $ref: '#/components/responses/PaperUnavailable'
  /api/v1/reports/paper:
    get:
      operationId: getPaperReport
      tags: [Reports]
      summary: Read the paper P&L report
      description: |
        Returns a report over the caller's paper fills (every replay, not only
        the current one). All amounts are integer paise. Dates are IST
        calendar dates of the demo session a fill belongs to.

        - `status: empty` (with no `data`) when the caller has no paper fill
          at all and has never assigned a strategy. Otherwise `ready`.
        - `from` and `to` filter fills by session date, both inclusive. Each
          is optional; an open side is unbounded. `period` echoes the given
          dates and fills an open side with the earliest (`from`) or latest
          (`to`) fill date in the period, or `null` when the period has no
          fill.
        - `summary`, `daily`, `strategies` and `journal` cover only fills in
          the period. `daily` lists only dates with at least one fill,
          oldest first. `journal` lists the period's fills newest first, at
          most 500; `journalTruncated` is true when more exist (use
          `exportPaperTrades` for all of them).
        - Realised P&L of a fill is its `pnlPaise` (zero for a buy; for a
          sell, proceeds minus cost minus both sides' fees). `netPaise` is
          `realisedPaise + unrealisedPaise`.
        - `openPosition` is the current replay's open position, marked at the
          close of the last replayed session, whatever the period; `null`
          when flat. `unrealisedPaise` in `summary` is that position's
          unrealised P&L (mark value minus cost minus the entry fee, before
          any exit fee), or `0` when flat.
        - `strategies` groups the period's fills by the strategy version that
          made them (the version pinned when the replay was assigned),
          ordered by strategy name then version. Fills recorded before the
          server kept this attribution have `strategy: null` and are grouped
          last under `strategy: null`.
        - `reconciliation` replays the current replay's ledger from the paper
          capital: cash = capital − Σ(buy fill × quantity + fees) +
          Σ(sell fill × quantity − fees); quantity = Σ buys − Σ sells. It is
          `matched` when both equal the paper account's values, otherwise
          `mismatch` (which a correct server never produces; a client shows
          it as an error). `null` when no strategy has ever been assigned.

        `stale` is reserved and not emitted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: The caller's paper report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/ReportInvalidRequest'
        '401':
          $ref: '#/components/responses/ReportUnauthenticated'
        '503':
          $ref: '#/components/responses/ReportUnavailable'
  /api/v1/reports/paper/trades.csv:
    get:
      operationId: exportPaperTrades
      tags: [Reports]
      summary: Export paper fills as CSV
      description: |
        Returns every paper fill in the period as CSV (RFC 4180, UTF-8, CRLF
        line endings, no byte-order mark), oldest first, with the same
        `from`/`to` rules as `getPaperReport`. The header row is always
        present, also when there are no fills:

        `date,filled_at,replay,strategy,version,instrument,side,quantity,fill_inr,fees_inr,pnl_inr,reason,trade_id`

        - `date` is the IST session date (`YYYY-MM-DD`); `filled_at` the
          RFC 3339 UTC time.
        - Money columns are rupees with exactly two decimals and no grouping
          (`-1234.50`), converted exactly from paise.
        - `strategy` is the strategy name and `version` its version number;
          both are empty for an unattributed fill. A field that contains a comma,
          quote or line break is quoted, with quotes doubled. A field that
          starts with `=`, `+`, `-` or `@` and is not a number is prefixed
          with `'` so spreadsheets do not run it as a formula.
        - `Content-Disposition: attachment; filename="tradeo-paper-trades.csv"`.

        PDF export is not served by the API; the client prints the report.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: The period's paper fills as CSV.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ReportInvalidRequest'
        '401':
          $ref: '#/components/responses/ReportUnauthenticated'
        '503':
          $ref: '#/components/responses/ReportUnavailable'
  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      summary: List the advisory agents
      description: |
        Returns the fixed roster of advisory agents, in the order shown, with
        the reason codes each one can record. The roster is the same for
        every user; use `getAgentHealth` for the caller's per-agent health and
        `listAgentEvents` for what each agent recorded.

        - `market-scanner` checks each replayed demo session of the caller's
          assigned instrument and records `LARGE_MOVE` when its
          close-to-close move (in percent, either direction) is at least twice
          the average of the five sessions before it. A session needs six
          earlier closes to be checked. The threshold is relative because the
          demo candles rarely move more than 1% a day.
        - `strategy-analyst` records `REPLAY_SUMMARY` when a replay
          finishes: the replay's fills, winning sells and realised P&L, linked to the replay.
        - `risk-explainer` explains deterministic risk outcomes that already
          happened: `STOP_LOSS_EXIT` for each stop-loss fill (linked to the
          fill), `LOSS_LIMIT_REACHED` and `TRADE_LIMIT_REACHED` once per
          replayed session that reached the limit, and `ENGINE_HALTED` when
          it observes the engine halted after last seeing it not halted.
        - `execution-monitor` records `ORDER_CANCELLED` for each cancelled
          paper order (linked to the order), `RECONCILIATION_MISMATCH` when
          the current replay's ledger stops matching the paper account (same
          rule as the report's `reconciliation`), and
          `RECONCILIATION_MATCHED` when it matches again after a mismatch.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The agent roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRoster'
        '401':
          $ref: '#/components/responses/AgentUnauthenticated'
        '503':
          $ref: '#/components/responses/AgentUnavailable'
  /api/v1/agents/health:
    get:
      operationId: getAgentHealth
      tags: [Agents]
      summary: Read the caller's agent health
      description: |
        Returns, for each agent in roster order, whether its view of the
        caller's paper data is current. A server-side worker evaluates each
        user's paper data every few seconds; health is computed at read time
        from the last evaluation.

        The paper data is *pending* when it changed after the change the
        agent last evaluated, or the agent has never evaluated it. A worker
        *pass* ends when the worker has evaluated every pending user; the
        server records when the last pass ended.

        Per agent, the first rule that applies wins:
        1. `unavailable` with `NO_PAPER_ACTIVITY` when the caller has never
           assigned a paper strategy. `lastRunAt` and `dataAsOf` are null.
        2. `stale` with `DATA_STALE` when the data is pending and either it
           last changed more than `staleAfterSeconds` ago, or no worker pass
           has ended in the last `staleAfterSeconds` (the worker is stopped,
           failing or behind). So a stopped worker reports `stale` within
           `staleAfterSeconds` even while the paper data keeps changing. Its
           events may be incomplete.
        3. `unavailable` with `NOT_YET_EVALUATED` when the agent has never
           evaluated the caller's data (and rule 2 does not apply).
        4. Otherwise `ok` with `reasonCode: null`: the data is evaluated, or
           pending for less than `staleAfterSeconds` with the worker running.
           An idle engine stays `ok`: unchanged data does not go stale.

        `dataAsOf` is the time of the paper data the agent last evaluated
        (the paper account's last change), `lastRunAt` when it last did so.
        `status` overall is `ok` when every agent is `ok`, `unavailable` when
        every agent is `unavailable`, and `degraded` otherwise.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's agent health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHealthReport'
        '401':
          $ref: '#/components/responses/AgentUnauthenticated'
        '503':
          $ref: '#/components/responses/AgentUnavailable'
  /api/v1/agents/events:
    get:
      operationId: listAgentEvents
      tags: [Agents]
      summary: List the caller's advisory events
      description: |
        Returns the caller's advisory events, newest first, one page at a
        time. Only the caller's own events are ever returned.

        - Events are ordered by a server-assigned sequence, newest first; ties
          in `at` keep that order. Events are append-only and never change.
        - `nextCursor` is null on the last page. Pass it as `cursor` with the
          same `agentId` to read the next page. A cursor is opaque; pages stay
          stable when new events are recorded meanwhile (new events appear
          only on a fresh first page). A malformed cursor, or one used with a
          different `agentId`, returns `400`.
        - `link` names the paper record an event is about (`paper-trade` and
          `paper-order` ids are the ids in `getPaperTrading`; a
          `paper-replay` id is the replay number, as in the CSV export). It is
          present only when the server verified, at read time, that the
          record exists and belongs to the caller; otherwise it is null.
        - `dataAsOf` is the time of the paper or demo data the event is about
          (a fill, or a demo session); `at` is when the agent recorded it.
        - An empty first page (`items: []`) means no event has been recorded
          yet; see `getAgentHealth` for whether that is because there is no
          paper activity or the agents are behind.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AgentIdFilter'
        - $ref: '#/components/parameters/AgentCursor'
        - $ref: '#/components/parameters/AgentLimit'
      responses:
        '200':
          description: One page of the caller's advisory events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEventPage'
        '400':
          $ref: '#/components/responses/AgentInvalidRequest'
        '401':
          $ref: '#/components/responses/AgentUnauthenticated'
        '503':
          $ref: '#/components/responses/AgentUnavailable'
  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [Alerts]
      summary: List the caller's alerts
      description: |
        Returns the caller's alerts, newest first, one page at a time, with
        unread counts for the badge.

        - Alerts are ordered by a server-assigned sequence, newest first; ties
          in `createdAt` keep that order.
        - Filters combine with AND. `severity` and `source` may each be given
          more than once (for example `severity=critical&severity=warning`).
          `status=unread` returns only alerts with `acknowledgedAt: null`.
        - **Preferences.** When the caller's preferences turn off `warning`
          or `info` in-app alerts, those alerts are left out of `items` and
          `unread`, as if filtered. They are still stored, so turning the
          preference back on shows them again. `critical` alerts are never
          left out.
        - `nextCursor` is null on the last page. Pass it as `cursor` with the
          same filters to read the next page. A cursor is opaque. Pages stay
          stable when new alerts arrive meanwhile (they appear only on a fresh
          first page). An acknowledgement made while paging can move an alert
          out of a `status=unread` listing, so it is not repeated on a later
          page; it is never shown twice. A malformed cursor, or one used with
          different filters or preferences, returns `400`.
        - `unread` counts the caller's unacknowledged alerts that the
          preferences allow, by severity, whatever the filters and page. It
          is computed in the same read as `items`.
        - An empty first page means the caller has no matching alert.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AlertSeverityFilter'
        - $ref: '#/components/parameters/AlertSourceFilter'
        - $ref: '#/components/parameters/AlertStatusFilter'
        - $ref: '#/components/parameters/AlertCursor'
        - $ref: '#/components/parameters/AlertLimit'
      responses:
        '200':
          description: One page of the caller's alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
        '400':
          $ref: '#/components/responses/AlertInvalidRequest'
        '401':
          $ref: '#/components/responses/AlertUnauthenticated'
        '503':
          $ref: '#/components/responses/AlertUnavailable'
  /api/v1/alerts/{alertId}/ack:
    post:
      operationId: acknowledgeAlert
      tags: [Alerts]
      summary: Acknowledge one alert
      description: |
        Marks one of the caller's alerts as read and returns it. The request
        has no body.

        Idempotent: acknowledging an alert that is already acknowledged
        returns `200` with the original `acknowledgedAt`, which never
        changes. Concurrent acknowledgements of the same alert all succeed
        and return the same `acknowledgedAt`.

        Acknowledging records that the caller has seen the alert. It does not
        change the condition behind it: a halted engine stays halted and an
        expired connection stays expired. There is no way to un-acknowledge
        or delete an alert.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: alertId
          in: path
          required: true
          description: The alert's `id`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The acknowledged alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/AlertUnauthenticated'
        '403':
          $ref: '#/components/responses/AlertCsrfFailed'
        '404':
          $ref: '#/components/responses/AlertNotFound'
        '503':
          $ref: '#/components/responses/AlertUnavailable'
  /api/v1/alerts/preferences:
    get:
      operationId: getAlertPreferences
      tags: [Alerts]
      summary: Read the caller's alert preferences
      description: |
        Returns which alert severities the caller sees in the app and which
        delivery channels exist. A caller who never saved preferences gets the
        defaults: every severity on.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's alert preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPreferences'
        '401':
          $ref: '#/components/responses/AlertUnauthenticated'
        '503':
          $ref: '#/components/responses/AlertUnavailable'
    put:
      operationId: updateAlertPreferences
      tags: [Alerts]
      summary: Replace the caller's optional alert preferences
      description: |
        Replaces the caller's optional in-app preferences and returns the
        result. `critical` alerts cannot be turned off and are not part of the
        request. Saving the same values again succeeds and changes nothing
        else. Each change is recorded in the account's audit log. The newest
        save wins.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertPreferencesUpdate'
      responses:
        '200':
          description: The saved preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPreferences'
        '400':
          $ref: '#/components/responses/AlertInvalidRequest'
        '401':
          $ref: '#/components/responses/AlertUnauthenticated'
        '403':
          $ref: '#/components/responses/AlertCsrfFailed'
        '503':
          $ref: '#/components/responses/AlertUnavailable'
components:
  parameters:
    ReportFrom:
      name: from
      in: query
      required: false
      description: First IST session date to include (`YYYY-MM-DD`). Must not be after `to`.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      required: false
      description: Last IST session date to include (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
    AgentIdFilter:
      name: agentId
      in: query
      required: false
      description: Only this agent's events. Omit for every agent.
      schema:
        $ref: '#/components/schemas/AgentId'
    AgentCursor:
      name: cursor
      in: query
      required: false
      description: The previous page's `nextCursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentLimit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AlertSeverityFilter:
      name: severity
      in: query
      required: false
      description: Only these severities. Repeat for more than one. Omit for every severity.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 3
        uniqueItems: true
        items:
          $ref: '#/components/schemas/AlertSeverity'
    AlertSourceFilter:
      name: source
      in: query
      required: false
      description: Only these sources. Repeat for more than one. Omit for every source.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 4
        uniqueItems: true
        items:
          $ref: '#/components/schemas/AlertSource'
    AlertStatusFilter:
      name: status
      in: query
      required: false
      description: '`unread` for unacknowledged alerts only.'
      schema:
        enum: [all, unread]
        default: all
    AlertCursor:
      name: cursor
      in: query
      required: false
      description: The previous page's `nextCursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AlertLimit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tradeo_session
      description: Opaque server-side session identifier. HttpOnly, never readable by scripts.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        Signed CSRF token bound to the session or pre-login context. Must equal
        the `__Host-tradeo_csrf` cookie value and pass the checks in the Auth
        tag. Required on state-changing auth requests.
  headers:
    SetCookieCsrf:
      description: >
        Zero to two separate `Set-Cookie` fields, in this order. Field 1 clears
        the session cookie and is sent only when the request carried a stale
        session cookie. Field 2 sets `__Host-tradeo_csrf` and is sent only when
        a new token was issued. Not combined into one field.
      schema:
        type: string
      examples:
        clearStaleSession:
          summary: Field 1, only for a stale session cookie
          value: '__Host-tradeo_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT'
        csrf:
          summary: Field 2, only when a new token was issued
          value: '__Host-tradeo_csrf=<signed-token>; Path=/; Secure; HttpOnly; SameSite=Lax'
    SetCookieLogin:
      description: >
        Exactly two separate `Set-Cookie` header fields, in this order. Not
        combined into one field.
      schema:
        type: string
      examples:
        session:
          summary: Field 1 of 2
          value: '__Host-tradeo_session=<opaque-session-id>; Path=/; Secure; HttpOnly; SameSite=Lax'
        csrf:
          summary: Field 2 of 2
          value: '__Host-tradeo_csrf=<signed-session-token>; Path=/; Secure; HttpOnly; SameSite=Lax'
    SetCookieLogout:
      description: >
        Exactly two separate `Set-Cookie` header fields, in this order, that
        clear both cookies. Not combined into one field.
      schema:
        type: string
      examples:
        session:
          summary: Field 1 of 2
          value: '__Host-tradeo_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT'
        csrf:
          summary: Field 2 of 2
          value: '__Host-tradeo_csrf=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT'
  schemas:
    CsrfToken:
      type: object
      required: [csrfToken, context, expiresAt]
      properties:
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Opaque server-signed token. Hold it in memory; do not persist it.
        context:
          enum: [pre_login, session]
          description: >
            What the token is bound to. A `pre_login` token cannot authorize
            session-only operations. It is also returned when the request carried
            a stale session cookie; the client is then signed out.
        expiresAt:
          type: string
          format: date-time
          description: Request a new token after this time.
    Phone:
      type: string
      pattern: '^\+91[6-9][0-9]{9}$'
      examples: ['+919876543210']
      description: Indian mobile number in E.164 format. The client converts a 10-digit entry by prefixing +91.
    OtpRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        channel:
          enum: [sms, email]
          default: sms
          description: >
            Where to deliver the code. `email` goes to the address on file for
            an invited account; if there is none, nothing is sent and the
            response is the same.
    OtpChallenge:
      type: object
      required: [challengeId, channel, expiresAt, resendAvailableAt]
      properties:
        challengeId:
          type: string
          format: uuid
        channel:
          enum: [sms, email]
          description: The channel that was asked for, echoed back.
        expiresAt:
          type: string
          format: date-time
          description: At most 5 minutes after creation.
        resendAvailableAt:
          type: string
          format: date-time
          description: Earliest time another code can be requested for this phone.
    OtpVerify:
      type: object
      required: [challengeId, code]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'
    AuthUser:
      type: object
      required: [id, phoneMasked, displayName, createdAt, totpEnabled]
      properties:
        id:
          type: string
          format: uuid
        phoneMasked:
          type: string
          description: Phone with the middle digits hidden, such as `+91******3210`. The full number is never returned.
        displayName:
          type: [string, 'null']
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        totpEnabled:
          type: boolean
          description: Whether an authenticator app is active for this account.
    SessionExpiry:
      type: object
      required: [idleExpiresAt, expiresAt, stepUpUntil]
      properties:
        idleExpiresAt:
          type: string
          format: date-time
          description: Session ends at this time without activity. Extended by activity, never past `expiresAt`.
        expiresAt:
          type: string
          format: date-time
          description: Absolute end of the session.
        stepUpUntil:
          type: [string, 'null']
          format: date-time
          description: End of the step-up window on this session, or null when it is closed (see the Step-up tag).
    AuthSession:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionExpiry'
    OtpVerifyResponse:
      type: object
      required: [user, session, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionExpiry'
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: >
            New `session` CSRF token bound to the session just created. It
            replaces the pre-login token, which stops working. Required: the
            client must send this value as `X-CSRF-Token` on its next write.
    TotpCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The current six-digit code from the authenticator app.
    TotpEnrollment:
      type: object
      required: [secret, otpauthUri, expiresAt]
      additionalProperties: false
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
          description: Base32 secret (160 bits). Shown once. Never logged.
        otpauthUri:
          type: string
          minLength: 1
          description: '`otpauth://totp/...` URI carrying the same secret, for a QR code.'
        expiresAt:
          type: string
          format: date-time
          description: The pending secret stops being confirmable at this time (15 minutes after creation).
    StepUpResult:
      type: object
      required: [totpEnabled, stepUpUntil]
      additionalProperties: false
      properties:
        totpEnabled:
          const: true
        stepUpUntil:
          type: string
          format: date-time
          description: End of the step-up window on this session.
    SessionSummary:
      type: object
      required: [id, deviceLabel, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque identifier. It is not the session secret and cannot authenticate a request.
        deviceLabel:
          type: [string, 'null']
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
    AuthError:
      type: object
      required: [code, message]
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - INVALID_OTP
            - CSRF_FAILED
            - RATE_LIMITED
            - OTP_DELIVERY_UNAVAILABLE
            - STEP_UP_REQUIRED
            - INVALID_TOTP
            - TOTP_NOT_ENROLLED
            - TOTP_ALREADY_ENROLLED
            - TOTP_NOT_PENDING
            - INTERNAL_ERROR
        message:
          type: string
          description: Safe to show to the user. Never contains codes, tokens or internal details.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header. Quote it when reporting a problem.
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Only on 429. Matches the `Retry-After` header.
    BrokerId:
      type: string
      enum: [zerodha, fyers]
    BrokerAction:
      type: string
      enum: [connect, reconnect, sync, disconnect]
    BrokerActionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/BrokerAction'
    BrokerResult:
      oneOf:
        - type: object
          required: [status, data]
          additionalProperties: false
          properties:
            status:
              enum: [ready, stale]
            data:
              $ref: '#/components/schemas/BrokerSnapshot'
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              const: empty
    BrokerSnapshot:
      type: object
      required: [source, environment, asOf, connections, events]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: DEMO
        asOf:
          type: string
          format: date-time
          description: Server time the snapshot was built. Connection status is computed against it.
        connections:
          type: array
          description: Exactly one entry per provider, in the order zerodha, fyers.
          minItems: 2
          maxItems: 2
          prefixItems:
            - allOf:
                - $ref: '#/components/schemas/BrokerConnection'
                - properties:
                    provider:
                      const: zerodha
            - allOf:
                - $ref: '#/components/schemas/BrokerConnection'
                - properties:
                    provider:
                      const: fyers
          items: false
        events:
          type: array
          maxItems: 50
          description: The caller's 50 most recent demo actions, oldest first.
          items:
            $ref: '#/components/schemas/BrokerEvent'
    BrokerConnection:
      type: object
      required: [provider, account]
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/BrokerId'
        account:
          description: Null for a disconnected provider.
          oneOf:
            - $ref: '#/components/schemas/BrokerAccount'
            - type: 'null'
    BrokerAccount:
      type: object
      required: [maskedAccountId, connectedAt, expiresAt, lastSyncedAt, scopes]
      additionalProperties: false
      properties:
        maskedAccountId:
          type: string
          pattern: '^•••• [0-9]{4}$'
          examples: ['•••• 4821']
          description: Demo label. Not a real broker account.
        connectedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The demo connection is expired at or after this instant.
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
          description: Null until the first sync for the current demo connection.
        scopes:
          type: array
          uniqueItems: true
          description: Tradeo demo labels for read-only access.
          items:
            type: string
            enum: [profile_read, holdings_read, orders_read]
    BrokerEvent:
      type: object
      required: [id, provider, action, at]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque, unique per event.
        provider:
          $ref: '#/components/schemas/BrokerId'
        action:
          $ref: '#/components/schemas/BrokerAction'
        at:
          type: string
          format: date-time
    BrokerError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - CSRF_FAILED
            - BROKER_ACTION_CONFLICT
            - BROKER_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
    StrategyResult:
      oneOf:
        - type: object
          required: [status, data]
          additionalProperties: false
          properties:
            status:
              enum: [ready, stale]
            data:
              $ref: '#/components/schemas/StrategySnapshot'
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              const: empty
    StrategySnapshot:
      type: object
      required: [source, environment, asOf, strategies]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: DEMO
        asOf:
          type: string
          format: date-time
        strategies:
          type: array
          maxItems: 100
          description: The caller's strategies, oldest first.
          items:
            $ref: '#/components/schemas/Strategy'
    Strategy:
      type: object
      required: [id, status, draft, versions, metrics]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque identifier.
        status:
          enum: [draft, active, paused]
        draft:
          oneOf:
            - $ref: '#/components/schemas/StrategyRevision'
            - type: 'null'
        versions:
          type: array
          description: Immutable activated versions, ordered oldest first.
          items:
            $ref: '#/components/schemas/StrategyVersion'
        metrics:
          description: Always null until paper execution produces measured results.
          oneOf:
            - $ref: '#/components/schemas/StrategyMetrics'
            - type: 'null'
    StrategyRevision:
      type: object
      required: [parameters, backtest, riskReview]
      additionalProperties: false
      properties:
        parameters:
          $ref: '#/components/schemas/StrategyParameters'
        backtest:
          enum: [passed, failed, unavailable]
        riskReview:
          enum: [approved, rejected, pending]
          description: '`pending` is reserved and no longer emitted.'
    StrategyVersion:
      type: object
      required: [number, activatedAt, parameters, backtest, riskReview]
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
        activatedAt:
          type: string
          format: date-time
        parameters:
          $ref: '#/components/schemas/StrategyParameters'
        backtest:
          const: passed
        riskReview:
          const: approved
    StrategyParameters:
      type: object
      required: [name, description, instrument, timeframe, riskTier, positionSizeBps, stopLossBps]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
          description: Stored trimmed. Commands use StrategyParametersInput.
        description:
          type: string
          maxLength: 240
          description: Stored trimmed. Commands use StrategyParametersInput.
        instrument:
          enum: [NIFTY 50, BANKNIFTY, FINNIFTY, RELIANCE, HDFCBANK, SBIN]
        timeframe:
          enum: [5m, 15m, 30m, 1h, 1D]
        riskTier:
          enum: [low, medium, high]
        positionSizeBps:
          type: integer
          minimum: 1
          maximum: 10000
        stopLossBps:
          type: integer
          minimum: 1
          maximum: 10000
    StrategyParametersInput:
      description: >-
        Parameters as sent in a command. The server trims surrounding
        whitespace from name and description before storing them, so the
        length limits apply to the trimmed values: name 3-64 characters,
        description up to 240. The patterns encode exactly those limits.
        Stored and returned values use StrategyParameters.
      type: object
      required: [name, description, instrument, timeframe, riskTier, positionSizeBps, stopLossBps]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^\s*\S[\s\S]{1,62}\S\s*$'
        description:
          type: string
          pattern: '^\s*(\S([\s\S]{0,238}\S)?)?\s*$'
        instrument:
          $ref: '#/components/schemas/StrategyParameters/properties/instrument'
        timeframe:
          $ref: '#/components/schemas/StrategyParameters/properties/timeframe'
        riskTier:
          $ref: '#/components/schemas/StrategyParameters/properties/riskTier'
        positionSizeBps:
          $ref: '#/components/schemas/StrategyParameters/properties/positionSizeBps'
        stopLossBps:
          $ref: '#/components/schemas/StrategyParameters/properties/stopLossBps'
    StrategyMetrics:
      type: object
      required: [pnlPaise, winRateBps]
      additionalProperties: false
      properties:
        pnlPaise:
          type: integer
          minimum: -1000000000000
          maximum: 1000000000000
          description: Signed INR profit or loss in whole paise.
        winRateBps:
          type: integer
          minimum: 0
          maximum: 10000
    StrategyCommand:
      oneOf:
        - type: object
          required: [action, parameters]
          additionalProperties: false
          properties:
            action:
              const: create
            parameters:
              $ref: '#/components/schemas/StrategyParametersInput'
        - type: object
          required: [action, id, parameters]
          additionalProperties: false
          properties:
            action:
              const: save-draft
            id:
              type: string
              minLength: 1
            parameters:
              $ref: '#/components/schemas/StrategyParametersInput'
        - type: object
          required: [action, id]
          additionalProperties: false
          properties:
            action:
              enum: [activate, pause]
            id:
              type: string
              minLength: 1
    StrategyError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - CSRF_FAILED
            - STRATEGY_NOT_FOUND
            - STRATEGY_CONFLICT
            - STRATEGY_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
    BacktestWorkspaceResult:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          enum: [ready, stale]
        data:
          $ref: '#/components/schemas/BacktestWorkspace'
    BacktestWorkspace:
      type: object
      required: [source, environment, asOf, from, to, strategies, instruments, runs]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: DEMO
        asOf:
          type: string
          format: date-time
        from:
          type: string
          format: date
          description: First session of the demo daily history.
        to:
          type: string
          format: date
          description: Last session of the demo daily history.
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/BacktestStrategy'
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/BacktestInstrument'
        runs:
          type: array
          maxItems: 20
          description: The caller's most recent runs, newest first.
          items:
            $ref: '#/components/schemas/BacktestRun'
    BacktestStrategy:
      type: object
      required: [id, name, revision, instrumentId, positionSizeBps]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Opaque identifier of one strategy revision.
        name:
          type: string
          minLength: 1
        revision:
          oneOf:
            - type: integer
              minimum: 1
            - const: draft
        instrumentId:
          $ref: '#/components/schemas/InstrumentId'
        positionSizeBps:
          type: integer
          minimum: 1
          maximum: 10000
    BacktestInstrument:
      type: object
      required: [id, symbol]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
        symbol:
          type: string
          minLength: 1
    BacktestConfig:
      type: object
      required: [strategyId, instrumentId, from, to, outOfSampleFrom, capitalPaise, feeBps, slippageBps]
      additionalProperties: false
      properties:
        strategyId:
          type: string
          minLength: 1
          maxLength: 64
        instrumentId:
          type: string
          minLength: 1
          maxLength: 64
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        outOfSampleFrom:
          type: string
          format: date
        capitalPaise:
          type: integer
          minimum: 100000
          maximum: 1000000000
        feeBps:
          type: integer
          minimum: 0
          maximum: 500
        slippageBps:
          type: integer
          minimum: 0
          maximum: 500
    BacktestRun:
      type: object
      required: [id, source, environment, asOf, queuedAt, config, status]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        source:
          const: demo
        environment:
          const: DEMO
        asOf:
          type: string
          format: date-time
          description: When the run last changed status.
        queuedAt:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/BacktestConfig'
        status:
          enum: [queued, running, completed, failed]
        result:
          $ref: '#/components/schemas/BacktestResult'
        message:
          type: string
          description: Why the run failed. Safe to show to the user.
      allOf:
        - if:
            properties:
              status:
                const: completed
          then:
            required: [result]
          else:
            not:
              required: [result]
        - if:
            properties:
              status:
                const: failed
          then:
            required: [message]
          else:
            not:
              required: [message]
    BacktestResult:
      type: object
      required: [endingEquityPaise, netPnlPaise, returnBps, maxDrawdownBps, winRateBps, totalFeesPaise, points, trades]
      additionalProperties: false
      properties:
        endingEquityPaise:
          type: integer
          minimum: 0
        netPnlPaise:
          type: integer
        returnBps:
          type: integer
        maxDrawdownBps:
          type: integer
          maximum: 0
        winRateBps:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          description: Null when the run closed no trades.
        totalFeesPaise:
          type: integer
          minimum: 0
        points:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/BacktestPoint'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/BacktestTrade'
    BacktestPoint:
      type: object
      required: [date, equityPaise, drawdownBps]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        equityPaise:
          type: integer
          minimum: 0
        drawdownBps:
          type: integer
          maximum: 0
    BacktestTrade:
      type: object
      required: [id, entryAt, exitAt, quantity, entryPaise, exitPaise, feesPaise, pnlPaise]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        entryAt:
          type: string
          format: date-time
        exitAt:
          type: string
          format: date-time
        quantity:
          type: integer
          minimum: 1
        entryPaise:
          type: integer
          minimum: 1
        exitPaise:
          type: integer
          minimum: 1
        feesPaise:
          type: integer
          minimum: 0
        pnlPaise:
          type: integer
    BacktestError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - CSRF_FAILED
            - BACKTEST_NOT_FOUND
            - BACKTEST_CONFLICT
            - BACKTEST_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
    InstrumentId:
      type: string
      pattern: '^NSE:[A-Z0-9_.&-]+$'
      examples: ['NSE:NIFTY50', 'NSE:RELIANCE']
    Instrument:
      type: object
      required: [id, symbol, name, exchange, kind, currency, aliases]
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
        symbol:
          type: string
        name:
          type: string
        exchange:
          const: NSE
        kind:
          enum: [index, equity]
        currency:
          const: INR
        aliases:
          type: array
          items:
            type: string
    InstrumentList:
      type: object
      required: [instruments]
      properties:
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
    Source:
      enum: [demo, market]
      description: Origin of the response. Demo data must be labeled in the UI.
    InstrumentQuote:
      type: object
      required: [instrumentId, price, previousClose, change, changePercent, open, high, low, volume, trend]
      properties:
        instrumentId:
          $ref: '#/components/schemas/InstrumentId'
        price:
          type: number
          minimum: 0
        previousClose:
          type: number
          minimum: 0
        change:
          type: number
          description: Signed difference from the previous close in INR.
        changePercent:
          type: number
          description: Signed percentage points relative to the previous close.
        open:
          type: number
          minimum: 0
        high:
          type: number
          minimum: 0
        low:
          type: number
          minimum: 0
        volume:
          $ref: '#/components/schemas/Volume'
        trend:
          enum: [up, down, flat]
          description: Direction of the change versus the previous close.
    Volume:
      type: [integer, 'null']
      minimum: 0
      description: Shares traded in the session or candle. Null when unavailable, such as for a cash index.
    MarketSession:
      type: object
      required: [exchange, status, timezone, opensAt, closesAt]
      properties:
        exchange:
          const: NSE
        status:
          enum: [preopen, open, closed]
          description: Exchange session state at the snapshot timestamp.
        timezone:
          const: Asia/Kolkata
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
    MarketOverview:
      type: object
      required: [source, asOf, session, quotes]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        asOf:
          type: string
          format: date-time
        session:
          $ref: '#/components/schemas/MarketSession'
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentQuote'
    Timeframe:
      enum: [1m, 5m, 15m, 30m, 1h, 1D]
      description: >
        Intraday bars are anchored to the session open. The final intraday bar
        may have a shorter duration. A daily bar represents one trading session.
    MarketCandle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: string
          format: date-time
          description: Candle opening instant in UTC.
        open:
          type: number
          minimum: 0
        high:
          type: number
          minimum: 0
        low:
          type: number
          minimum: 0
        close:
          type: number
          minimum: 0
        volume:
          $ref: '#/components/schemas/Volume'
    MarketCandles:
      type: object
      required: [instrumentId, timeframe, source, asOf, freshness, candles]
      properties:
        instrumentId:
          $ref: '#/components/schemas/InstrumentId'
        timeframe:
          $ref: '#/components/schemas/Timeframe'
        source:
          $ref: '#/components/schemas/Source'
        asOf:
          type: string
          format: date-time
          description: Timestamp of the history snapshot.
        freshness:
          enum: [fresh, stale]
          description: Whether the response represents the latest expected snapshot or older data.
        candles:
          type: array
          items:
            $ref: '#/components/schemas/MarketCandle'
    MarketError:
      type: object
      required: [code, message]
      properties:
        code:
          enum: [INVALID_REQUEST, UNKNOWN_INSTRUMENT, MARKET_DATA_UNAVAILABLE]
        message:
          type: string
    PaperResult:
      oneOf:
        - type: object
          required: [status, data]
          additionalProperties: false
          properties:
            status:
              enum: [ready, stale]
            data:
              $ref: '#/components/schemas/PaperSnapshot'
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              const: empty
    PaperSnapshot:
      type: object
      required: [source, environment, asOf, engine, strategies, strategyId, agent, risk, account, replay, orders, trades, events]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: PAPER
        asOf:
          type: string
          format: date-time
        engine:
          enum: [idle, running, halted]
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/PaperStrategy'
        strategyId:
          description: The assigned strategy, or null before the first assignment.
          type: [string, 'null']
          maxLength: 64
        agent:
          type: object
          required: [name, ready]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
            ready:
              type: boolean
              description: >
                True when a strategy is assigned, is still active and its
                replay has not finished.
        risk:
          $ref: '#/components/schemas/PaperRisk'
        account:
          $ref: '#/components/schemas/PaperAccount'
        replay:
          $ref: '#/components/schemas/PaperReplay'
        orders:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PaperOrder'
        trades:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PaperTrade'
        events:
          type: array
          maxItems: 50
          description: The most recent events, in chronological order.
          items:
            $ref: '#/components/schemas/PaperEvent'
    PaperStrategy:
      type: object
      required: [id, name, instrument, version]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
        instrument:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
          description: >
            For listed strategies, the latest version. The assigned strategy
            keeps the version pinned when it was assigned.
    PaperRisk:
      type: object
      required: [status, dailyLossPaise, lossLimitPaise, tradesToday, tradeLimit]
      additionalProperties: false
      properties:
        status:
          enum: [approved, blocked]
          description: >
            `blocked` while the engine is halted, or the current session's
            realised loss has reached `lossLimitPaise`, or its fills have
            reached `tradeLimit`. The current session is the last replayed
            one; `dailyLossPaise` and `tradesToday` count only its fills and
            start from zero when the next session is replayed. `halt`,
            `reset` and `pause` do not clear them; `assign` starts a fresh
            replay with no current session, so both are zero. `blocked` only
            stops new buys from being queued; it never blocks a command.
        dailyLossPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        lossLimitPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        tradesToday:
          type: integer
          minimum: 0
        tradeLimit:
          type: integer
          minimum: 1
    PaperAccount:
      type: object
      required: [capitalPaise, cashPaise, equityPaise, positionQuantity, perTradeRiskPaise]
      additionalProperties: false
      properties:
        capitalPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        cashPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        equityPaise:
          $ref: '#/components/schemas/NonnegativePaise'
          description: Cash plus the open position at the last replayed close.
        positionQuantity:
          type: integer
          minimum: 0
        perTradeRiskPaise:
          $ref: '#/components/schemas/NonnegativePaise'
    PaperReplay:
      type: object
      required: [sessionDate, sessionsDone, sessionsTotal, finished]
      additionalProperties: false
      properties:
        sessionDate:
          description: The last replayed demo session, or null before the first.
          type: [string, 'null']
          format: date
        sessionsDone:
          type: integer
          minimum: 0
        sessionsTotal:
          type: integer
          minimum: 0
        finished:
          type: boolean
    PaperOrder:
      type: object
      required: [id, instrument, side, quantity, limitPaise, approval, status]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        instrument:
          type: string
          minLength: 1
        side:
          enum: [Buy, Sell]
        quantity:
          type: integer
          minimum: 1
        limitPaise:
          $ref: '#/components/schemas/NonnegativePaise'
          description: The close the order was decided on; orders fill at the next open.
        approval:
          enum: [approved, pending]
          description: Orders are created only after the risk engine approves; `pending` is reserved.
        status:
          enum: [queued, held, filled, cancelled]
          description: '`held` is reserved and not emitted.'
    PaperTrade:
      type: object
      required: [id, instrument, side, quantity, fillPaise, feesPaise, pnlPaise, filledAt, reason]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        instrument:
          type: string
          minLength: 1
        side:
          enum: [Buy, Sell]
        quantity:
          type: integer
          minimum: 1
        fillPaise:
          type: integer
          minimum: 1
        feesPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        pnlPaise:
          type: integer
          description: >
            Realised P&L of this fill after both sides' fees, in paise. Zero
            for a buy, which opens a position.
        filledAt:
          type: string
          format: date-time
          description: The demo session's time.
        reason:
          enum: [entry, signal-exit, stop-loss, end-of-replay]
    PaperEvent:
      type: object
      required: [id, at, message]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        at:
          type: string
          format: date-time
        message:
          type: string
          minLength: 1
    PaperCommand:
      oneOf:
        - type: object
          required: [action, strategyId]
          additionalProperties: false
          properties:
            action:
              const: assign
            strategyId:
              type: string
              minLength: 1
              maxLength: 64
        - type: object
          required: [action]
          additionalProperties: false
          properties:
            action:
              enum: [start, pause, reset]
        - type: object
          required: [action, confirmation]
          additionalProperties: false
          properties:
            action:
              const: halt
            confirmation:
              const: STOP
    NonnegativePaise:
      type: integer
      minimum: 0
      description: Nonnegative amount in INR minor units (paise).
    PaperError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - CSRF_FAILED
            - PAPER_CONFLICT
            - PAPER_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
    ReportResult:
      oneOf:
        - type: object
          required: [status, data]
          additionalProperties: false
          properties:
            status:
              enum: [ready, stale]
            data:
              $ref: '#/components/schemas/PaperReport'
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              const: empty
    PaperReport:
      type: object
      required: [source, environment, asOf, period, summary, openPosition, daily, strategies, journal, journalTruncated, reconciliation]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: PAPER
        asOf:
          type: string
          format: date-time
        period:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from:
              type: [string, 'null']
              format: date
            to:
              type: [string, 'null']
              format: date
        summary:
          $ref: '#/components/schemas/ReportSummary'
        openPosition:
          oneOf:
            - $ref: '#/components/schemas/ReportOpenPosition'
            - type: 'null'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/ReportDay'
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/ReportStrategy'
        journal:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReportTrade'
        journalTruncated:
          type: boolean
        reconciliation:
          oneOf:
            - $ref: '#/components/schemas/ReportReconciliation'
            - type: 'null'
    ReportSummary:
      type: object
      required: [realisedPaise, unrealisedPaise, netPaise, feesPaise, fills, closedTrades, winningTrades, losingTrades]
      additionalProperties: false
      properties:
        realisedPaise:
          type: integer
        unrealisedPaise:
          type: integer
        netPaise:
          type: integer
        feesPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        fills:
          type: integer
          minimum: 0
        closedTrades:
          type: integer
          minimum: 0
          description: Sell fills in the period (each closes a position).
        winningTrades:
          type: integer
          minimum: 0
          description: Sell fills with `pnlPaise > 0`.
        losingTrades:
          type: integer
          minimum: 0
          description: Sell fills with `pnlPaise < 0`.
    ReportOpenPosition:
      type: object
      required: [instrument, quantity, entryPaise, markPaise, markedAt, unrealisedPaise]
      additionalProperties: false
      properties:
        instrument:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        entryPaise:
          type: integer
          minimum: 1
        markPaise:
          type: integer
          minimum: 1
          description: Close of the last replayed demo session.
        markedAt:
          type: string
          format: date-time
          description: That session's time.
        unrealisedPaise:
          type: integer
    ReportDay:
      type: object
      required: [date, realisedPaise, feesPaise, fills]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        realisedPaise:
          type: integer
        feesPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        fills:
          type: integer
          minimum: 1
    ReportStrategyRef:
      type: object
      required: [id, name, version]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
    ReportStrategy:
      type: object
      required: [strategy, realisedPaise, feesPaise, fills, closedTrades]
      additionalProperties: false
      properties:
        strategy:
          description: The strategy version that made these fills; `null` groups unattributed fills.
          oneOf:
            - $ref: '#/components/schemas/ReportStrategyRef'
            - type: 'null'
        realisedPaise:
          type: integer
        feesPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        fills:
          type: integer
          minimum: 1
        closedTrades:
          type: integer
          minimum: 0
    ReportTrade:
      type: object
      required: [id, date, replay, strategy, instrument, side, quantity, fillPaise, feesPaise, pnlPaise, filledAt, reason]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        date:
          type: string
          format: date
        replay:
          type: integer
          minimum: 1
        strategy:
          description: The strategy version that made the fill; `null` when unattributed.
          oneOf:
            - $ref: '#/components/schemas/ReportStrategyRef'
            - type: 'null'
        instrument:
          type: string
          minLength: 1
        side:
          enum: [Buy, Sell]
        quantity:
          type: integer
          minimum: 1
        fillPaise:
          type: integer
          minimum: 1
        feesPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        pnlPaise:
          type: integer
        filledAt:
          type: string
          format: date-time
        reason:
          enum: [entry, signal-exit, stop-loss, end-of-replay]
    ReportReconciliation:
      type: object
      required: [status, replay, ledgerCashPaise, accountCashPaise, ledgerQuantity, accountQuantity]
      additionalProperties: false
      properties:
        status:
          enum: [matched, mismatch]
        replay:
          type: integer
          minimum: 1
        ledgerCashPaise:
          type: integer
        accountCashPaise:
          $ref: '#/components/schemas/NonnegativePaise'
        ledgerQuantity:
          type: integer
        accountQuantity:
          type: integer
          minimum: 0
    AgentId:
      enum: [market-scanner, strategy-analyst, risk-explainer, execution-monitor]
    AgentReasonCode:
      enum:
        - LARGE_MOVE
        - REPLAY_SUMMARY
        - STOP_LOSS_EXIT
        - LOSS_LIMIT_REACHED
        - TRADE_LIMIT_REACHED
        - ENGINE_HALTED
        - ORDER_CANCELLED
        - RECONCILIATION_MISMATCH
        - RECONCILIATION_MATCHED
    AgentRoster:
      type: object
      required: [source, environment, agents]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: PAPER
        agents:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/Agent'
    Agent:
      type: object
      required: [id, name, description, role, inputs, reasonCodes]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/AgentId'
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        role:
          const: advisory
          description: Agents only record events; they cannot act.
        inputs:
          type: array
          minItems: 1
          description: The server data the agent reads.
          items:
            enum: [paper-account, paper-orders, paper-trades, paper-replays, demo-candles]
        reasonCodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgentReasonCode'
    AgentHealthReport:
      type: object
      required: [source, environment, asOf, status, agents]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: PAPER
        asOf:
          type: string
          format: date-time
          description: When the server computed this health.
        status:
          enum: [ok, degraded, unavailable]
        agents:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/AgentHealth'
    AgentHealth:
      type: object
      required: [agentId, status, reasonCode, lastRunAt, dataAsOf, staleAfterSeconds]
      additionalProperties: false
      properties:
        agentId:
          $ref: '#/components/schemas/AgentId'
        status:
          enum: [ok, stale, unavailable]
        reasonCode:
          description: Null when `ok`.
          enum: [NO_PAPER_ACTIVITY, NOT_YET_EVALUATED, DATA_STALE, null]
        lastRunAt:
          type: [string, 'null']
          format: date-time
        dataAsOf:
          type: [string, 'null']
          format: date-time
        staleAfterSeconds:
          type: integer
          minimum: 1
    AgentEventPage:
      type: object
      required: [source, environment, items, nextCursor]
      additionalProperties: false
      properties:
        source:
          const: demo
        environment:
          const: PAPER
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AgentEvent'
        nextCursor:
          description: Null on the last page.
          type: [string, 'null']
          minLength: 1
          maxLength: 128
    AgentEvent:
      type: object
      required: [id, agentId, at, dataAsOf, severity, reasonCode, message, recommendation, link]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        agentId:
          $ref: '#/components/schemas/AgentId'
        at:
          type: string
          format: date-time
        dataAsOf:
          type: string
          format: date-time
        severity:
          enum: [info, warning]
        reasonCode:
          $ref: '#/components/schemas/AgentReasonCode'
        message:
          type: string
          minLength: 1
          description: What the agent observed, in plain words.
        recommendation:
          type: [string, 'null']
          minLength: 1
          description: Advisory only; the server never acts on it.
        link:
          oneOf:
            - $ref: '#/components/schemas/AgentLink'
            - type: 'null'
    AgentLink:
      type: object
      required: [kind, id]
      additionalProperties: false
      properties:
        kind:
          enum: [paper-trade, paper-order, paper-replay]
        id:
          type: string
          minLength: 1
          maxLength: 64
    AgentError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - AGENTS_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
    AlertSeverity:
      enum: [critical, warning, info]
    AlertSource:
      enum: [paper, brokers, agents, security]
    AlertKind:
      description: See the table in the Alerts tag for when each kind is recorded.
      enum:
        - PAPER_ENGINE_HALTED
        - PAPER_RISK_LIMIT_REACHED
        - PAPER_ORDER_CANCELLED
        - PAPER_STOP_LOSS_EXIT
        - PAPER_STRATEGY_INACTIVE
        - PAPER_REPLAY_FINISHED
        - BROKER_CONNECTION_EXPIRED
        - BROKER_DISCONNECTED
        - RECONCILIATION_MISMATCH
        - NEW_SIGN_IN
        - SIGNED_OUT_EVERYWHERE
    AlertPage:
      type: object
      required: [asOf, items, nextCursor, unread]
      additionalProperties: false
      properties:
        asOf:
          type: string
          format: date-time
          description: When the server read this page.
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Alert'
        nextCursor:
          description: Null on the last page.
          type: [string, 'null']
          minLength: 1
          maxLength: 256
        unread:
          $ref: '#/components/schemas/AlertUnreadCounts'
    AlertUnreadCounts:
      type: object
      required: [total, critical, warning, info]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
    Alert:
      type: object
      required: [id, kind, source, severity, environment, title, message, occurredAt, createdAt, acknowledgedAt, link]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable and opaque. Never reused.
        kind:
          $ref: '#/components/schemas/AlertKind'
        source:
          $ref: '#/components/schemas/AlertSource'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        environment:
          description: >
            The data the alert is about: `PAPER` for the paper engine and
            agents, `DEMO` for demo broker connections, null for account
            security.
          enum: [PAPER, DEMO, null]
        title:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: What happened, in plain words. Never contains a secret, code or full phone number.
        occurredAt:
          type: string
          format: date-time
          description: When the source event happened (for example the halt, the fill or the expiry).
        createdAt:
          type: string
          format: date-time
          description: When the server recorded the alert. Equal to `occurredAt` for in-transaction alerts.
        acknowledgedAt:
          type: [string, 'null']
          format: date-time
          description: Null while unread. Set once and never changes.
        link:
          description: >
            The record the alert is about. Present only when the server
            verified, at read time, that the record exists and belongs to the
            caller; otherwise null.
          oneOf:
            - $ref: '#/components/schemas/AlertLink'
            - type: 'null'
    AlertLink:
      type: object
      required: [kind, id]
      additionalProperties: false
      description: >
        `paper-trade` and `paper-order` ids are the ids in `getPaperTrading`;
        a `paper-replay` id is the replay number, as in the CSV export; a
        `broker` id is the `BrokerId`; a `session` id is the id in
        `listSessions`.
      properties:
        kind:
          enum: [paper-trade, paper-order, paper-replay, broker, session]
        id:
          type: string
          minLength: 1
          maxLength: 64
    AlertPreferences:
      type: object
      required: [inApp, channels, updatedAt]
      additionalProperties: false
      properties:
        inApp:
          $ref: '#/components/schemas/AlertInAppPreferences'
        channels:
          type: array
          description: Delivery channels other than the app, and whether each can be used. None is available yet.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AlertChannel'
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Null until the caller first saves preferences.
    AlertInAppPreferences:
      type: object
      required: [critical, warning, info]
      additionalProperties: false
      properties:
        critical:
          const: true
          description: Critical alerts are always shown and cannot be turned off.
        warning:
          type: boolean
        info:
          type: boolean
    AlertChannel:
      type: object
      required: [channel, available, enabled]
      additionalProperties: false
      properties:
        channel:
          enum: [email, sms, push]
        available:
          const: false
          description: No provider is approved for this channel yet.
        enabled:
          const: false
    AlertPreferencesUpdate:
      type: object
      required: [inApp]
      additionalProperties: false
      properties:
        inApp:
          type: object
          required: [warning, info]
          additionalProperties: false
          properties:
            warning:
              type: boolean
            info:
              type: boolean
    AlertError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - CSRF_FAILED
            - ALERT_NOT_FOUND
            - ALERTS_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
    ReportError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - REPORTS_UNAVAILABLE
        message:
          type: string
          description: Safe to show to the user.
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
  responses:
    AuthInvalidRequest:
      description: The request body is missing, malformed or has an invalid field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    AuthUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    AuthCsrfFailed:
      description: The CSRF token is missing or wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: CSRF_FAILED
            message: The request could not be verified. Reload and try again.
    AuthRateLimited:
      description: Too many requests for this phone number, IP address or device.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: RATE_LIMITED
            message: Too many attempts. Try again later.
            retryAfterSeconds: 60
    AuthOtpDeliveryUnavailable:
      description: >
        Delivery is unavailable: the provider is down or misconfigured, or the
        daily delivery limit is reached. No code was sent and the client may
        retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: OTP_DELIVERY_UNAVAILABLE
            message: We could not send a code right now. Try again shortly.
    InvalidRequest:
      description: The request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketError'
    UnknownInstrument:
      description: The identifier is valid but absent from the catalog.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketError'
    MarketDataUnavailable:
      description: The requested market data is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketError'
    BrokerInvalidRequest:
      description: Unknown provider, or a missing or invalid action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrokerError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    BrokerUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrokerError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    BrokerCsrfFailed:
      description: The CSRF token is missing or wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrokerError'
          example:
            code: CSRF_FAILED
            message: The request could not be verified. Reload and try again.
    BrokerActionConflict:
      description: The action does not apply to the connection's current state, for example `sync` on an expired connection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrokerError'
          example:
            code: BROKER_ACTION_CONFLICT
            message: This broker account is not ready for that action.
    BrokerUnavailable:
      description: The broker workspace is disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrokerError'
          example:
            code: BROKER_UNAVAILABLE
            message: Broker accounts are temporarily unavailable. Try again shortly.
    StrategyInvalidRequest:
      description: Malformed command or invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrategyError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    StrategyUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrategyError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    StrategyCsrfFailed:
      description: The CSRF token is missing or wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrategyError'
          example:
            code: CSRF_FAILED
            message: The request could not be verified. Reload and try again.
    StrategyNotFound:
      description: No strategy with this id belongs to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrategyError'
          example:
            code: STRATEGY_NOT_FOUND
            message: This strategy is not available.
    StrategyConflict:
      description: >
        The command does not fit the strategy's state: activating an active
        strategy, activating without a passing backtest and approved risk
        review, pausing a strategy that is not active, or creating beyond the
        per-user limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrategyError'
          example:
            code: STRATEGY_CONFLICT
            message: A passing backtest and an approved risk review are required.
    StrategyUnavailable:
      description: The strategy workspace is disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrategyError'
          example:
            code: STRATEGY_UNAVAILABLE
            message: Strategies are temporarily unavailable. Try again shortly.
    BacktestInvalidRequest:
      description: >
        Malformed body, or a configuration the server cannot replay: an
        unknown strategy revision or instrument, dates out of order or outside
        the demo history, or too few warm-up or out-of-sample sessions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacktestError'
          example:
            code: INVALID_REQUEST
            message: Choose at least three warm-up sessions and two out-of-sample sessions.
    BacktestUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacktestError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    BacktestCsrfFailed:
      description: The CSRF token is missing or wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacktestError'
          example:
            code: CSRF_FAILED
            message: The request could not be verified. Reload and try again.
    BacktestNotFound:
      description: No run with this id belongs to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacktestError'
          example:
            code: BACKTEST_NOT_FOUND
            message: This backtest is not available.
    BacktestConflict:
      description: The caller already has three runs queued or running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacktestError'
          example:
            code: BACKTEST_CONFLICT
            message: Wait for a running backtest to finish before starting another.
    BacktestUnavailable:
      description: Backtests are disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacktestError'
          example:
            code: BACKTEST_UNAVAILABLE
            message: Backtests are temporarily unavailable. Try again shortly.
    PaperInvalidRequest:
      description: Malformed command body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaperError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    PaperUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaperError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    PaperCsrfFailed:
      description: The CSRF token is missing or wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaperError'
          example:
            code: CSRF_FAILED
            message: The request could not be verified. Reload and try again.
    PaperConflict:
      description: The command does not fit the engine's state, or the strategy cannot be assigned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaperError'
          example:
            code: PAPER_CONFLICT
            message: Pause or reset the paper engine before assigning a strategy.
    PaperUnavailable:
      description: Paper trading is disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaperError'
          example:
            code: PAPER_UNAVAILABLE
            message: Paper trading is temporarily unavailable. Try again shortly.
    ReportInvalidRequest:
      description: A date is malformed, or `from` is after `to`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    ReportUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    ReportUnavailable:
      description: Reports are disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportError'
          example:
            code: REPORTS_UNAVAILABLE
            message: Reports are temporarily unavailable. Try again shortly.
    AgentInvalidRequest:
      description: An unknown `agentId`, a `limit` out of range, or a malformed or mismatched `cursor`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    AgentUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    AgentUnavailable:
      description: Agents are disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentError'
          example:
            code: AGENTS_UNAVAILABLE
            message: Agents are temporarily unavailable. Try again shortly.
    AlertInvalidRequest:
      description: >
        A filter or `limit` out of range, a malformed cursor or one used with
        different filters or preferences, or a malformed preferences body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertError'
          example:
            code: INVALID_REQUEST
            message: The request parameters are invalid.
    AlertUnauthenticated:
      description: There is no valid session. It may be missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertError'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
    AlertCsrfFailed:
      description: The CSRF token is missing or wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertError'
          example:
            code: CSRF_FAILED
            message: The request could not be verified. Reload and try again.
    AlertNotFound:
      description: No alert with this id belongs to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertError'
          example:
            code: ALERT_NOT_FOUND
            message: This alert was not found.
    AlertUnavailable:
      description: Alerts are disabled or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertError'
          example:
            code: ALERTS_UNAVAILABLE
            message: Alerts are temporarily unavailable. Try again shortly.
    AuthStepUpOrCsrf:
      description: >
        `STEP_UP_REQUIRED`: the session did not sign in recently enough, or the
        step-up window is closed. `CSRF_FAILED`: the CSRF token is missing or
        wrong, or the Origin header does not match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          examples:
            stepUp:
              value:
                code: STEP_UP_REQUIRED
                message: Confirm with your authenticator, or sign in again, to continue.
            csrf:
              value:
                code: CSRF_FAILED
                message: The request could not be verified. Reload and try again.
    AuthTotpAlreadyEnrolled:
      description: An authenticator is already active. Remove it first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: TOTP_ALREADY_ENROLLED
            message: An authenticator is already set up.
    AuthTotpNotPending:
      description: There is no pending enrolment, or it has expired. Start again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            code: TOTP_NOT_PENDING
            message: Start the authenticator setup again.
    AuthTotpNotEnrolled:
      description: No authenticator is active for this account.
      content:
        application/json:
          schema:
